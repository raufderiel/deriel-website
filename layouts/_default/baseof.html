<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en-us" }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>{{ block "title" . }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="viewport" content="width=device-width,minimum-scale=1">
    {{ hugo.Generator }}
    {{ partial "site-style.html" . }}
    {{ partial "head-additions.html" . }}
  </head>

  <body class="ma0 {{ $.Param "body_classes"  | default "avenir bg-near-white" }}">
    
    <!-- Navbar Header Container -->
    <header style="background-color: rgb(2, 2, 83); padding: 0.5rem 1rem;">
      <div class="center" style="max-width: 80rem; display: flex; justify-content: space-between; align-items: center;">
        
        <!-- Left Logo Only -->
        <a href="/" class="f3 fw2 hover-white no-underline white-90 dib">
          {{ if .Site.Params.site_logo }}
            <img src="{{ .Site.Params.site_logo | relURL }}" alt="{{ .Site.Title }}" style="max-height: 40px; width: auto; display: block;" />
          {{ else }}
            {{ .Site.Title }}
          {{ end }}
        </a>

        <!-- Menu Links Only -->
        <div>
          {{ partial "site-navigation.html" . }}
        </div>

      </div>
    </header>

    <!-- Main Content (Margin Reset) -->
    <main class="pb7" role="main" style="margin-top: 0; padding-top: 1rem;">
      {{ block "main" . }}{{ end }}
    </main>

    {{ partial "site-footer.html" . }}
  </body>
</html>
