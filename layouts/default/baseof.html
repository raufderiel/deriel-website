<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      {{- if .IsHome -}}
        {{ .Site.Title }} | Official Website
      {{- else -}}
        {{ .Title }} | {{ .Site.Title }}
      {{- end -}}
    </title>
    {{ partial "head-additions.html" . }}
  </head>
  <body>
    {{ partial "site-header.html" . }}
    <main role="main">
      {{ block "main" . }}{{ end }}
    </main>
  </body>
</html>
